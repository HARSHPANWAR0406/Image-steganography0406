<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Image Steganography</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="HARSHPANWAR0406" />
    <meta name="description" content="Hide and retrieve messages in images using JavaScript." />

    <link rel="icon" type="image/png" href="images/0406.png" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="backend/styles.css" rel="stylesheet" />
</head>
<body>
    <div class="container">
        <h1 class="gradient-text">IMAGE STEGANOGRAPHY</h1>
        <div id="description">Hide and retrieve secret messages in images - By HARSHPANWAR0406</div>

        <!-- Mode Selector -->
        <div class="mb-4 text-center">
            <label for="mode" class="form-label text-warning fw-bold">Select Mode:</label>
            <select id="mode" class="form-select w-50 mx-auto">
                <option value="" selected disabled>-- Select Mode --</option>
                <option value="encode">Encode (Hide Message)</option>
                <option value="decode">Decode (Reveal Message)</option>
            </select>
        </div>

        <!-- Main Content (hidden initially) -->
        <div class="row d-none" id="mainContent">

            <div class="col-md-4">
                <h4>Choose Image:</h4>
                <input type="file" id="file" />

                <!-- Decode mode: Read button under file input -->
                <div id="readSection" class="btns mt-3 d-none">
                    <button id="read" class="btn btn-success">Read</button>
                </div>
            </div>

            <!-- Encode mode: text area + hide button -->
            <div class="col-md-8 d-none" id="textSection">
                <h4>Secret Message:</h4>
                <textarea id="text">Your secret message</textarea>
                <div class="btns">
                    <button id="hide" class="btn btn-warning">Hide</button>
                </div>
            </div>
        </div>

        <!-- Message Output -->
        <div id="messageArea" class="invisible mt-4">
            <h4 class="text-info">Decoded Message:</h4>
            <div id="message"></div>
            <button id="copy" onclick="copyText()" class="btn btn-outline-info mt-2">Copy Text</button>
        </div>

        <!-- Images -->
        <div class="row mt-5 d-none" id="imagesSection">
            <div class="col-md-6">
                <h4>Original Image:</h4>
                <div class="card">
                    <img id="img" class="card-img" src="images/0406.png" alt="Original" />
                </div>
            </div>

            <div class="col-md-6 d-none" id="stego">
                <h4>Encoded Image:</h4>
                <div class="card">
                    <img id="cover" class="card-img" src="" alt="Encoded" />
                </div>
                <div class="text-center mt-3">
                    <a id="download" class="btn btn-success" download="cover.png">Download Encoded Image</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
<footer class="footer mt-5 text-center text-light">
